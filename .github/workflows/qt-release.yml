name: Qt6 Portable Build & Release

on:
  push:
    branches:
      - '*' # Triggers automatically on any push to any branch

jobs:
  build:
    name: Build for ${{ matrix.os }}
    strategy:
      fail-fast: false # Prevents failing one OS from cancelling the other
      matrix:
        include:
          - os: windows-latest
            qt-arch: win64_msvc2022_64
          - os: ubuntu-22.04
            qt-arch: linux_gcc_64
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Qt 6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        arch: ${{ matrix.qt-arch }}
        modules: qtserialport

    # ==================== WINDOWS BUILD & DEPLOYMENT ====================
    - name: Set up MSVC Developer Command Prompt
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Compile project (Windows)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        qmake Terminal.pro
        nmake release

    - name: Deploy Qt dependencies (Windows Portable)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        mkdir dist
        copy release\Terminal.exe dist\
        windeployqt dist\Terminal.exe
        Compress-Archive -Path dist\* -DestinationPath Terminal-windows-portable.zip

    # ==================== LINUX BUILD & DEPLOYMENT ====================
    - name: Compile project (Linux)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update && sudo apt-get install -y build-essential libgl1-mesa-dev
        qmake Terminal.pro
        make

    - name: Package into AppImage (Linux Portable Qt6)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        # 1. Build standard Linux AppDir layout
        mkdir -p appdir/usr/bin
        mkdir -p appdir/usr/share/applications
        
        cp Terminal appdir/usr/bin/
        
        # 2. Create a clean desktop entry file
        echo -e "[Desktop Entry]\nType=Application\nName=Terminal\nExec=Terminal\nCategories=Utility;" > appdir/usr/share/applications/Terminal.desktop
        
        # 3. Assemble and download the link safely using piece-by-piece string parts
        # This completely avoids chat text truncation bugs
        PART1="https://github.com"
        PART2="/linuxdeploy/linuxdeploy/releases/download/continuous"
        FILE="linuxdeploy-x86_64.AppImage"
        
        FULL_URL="${PART1}${PART2}/${FILE}"
        
        curl -L -o linuxdeploy-x86_64.AppImage "$FULL_URL"
        chmod a+x linuxdeploy-x86_64.AppImage
        
        # 4. Point the tool to the location of the installed Qt6 SDK
        export QMAKE="/home/runner/work/Terminal/Qt/6.8.0/gcc_64/bin/qmake"
        export VERSION="1.0.0"
        
        # 5. Pack everything using standalone core runner
        ./linuxdeploy-x86_64.AppImage --appdir appdir --output appimage

    # ==================== UPLOAD WORKFLOW ARTIFACTS ====================
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.os }}
        path: |
          *.zip
          *.AppImage
