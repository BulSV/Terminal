name: Qt5 Portable Build & Release

on:
  push:
    tags:
      - 'v*' # Triggers the workflow only when a new version tag (e.g., v1.0.0) is pushed

jobs:
  build:
    name: Build for ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            qt-arch: win64_msvc2019_64
          - os: ubuntu-22.04 # Older Ubuntu version provides better glibc compatibility for AppImage
            qt-arch: gcc_64
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Install Qt framework using the community action
    - name: Install Qt 5
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        arch: ${{ matrix.qt-arch }}

    # ==================== WINDOWS BUILD & DEPLOYMENT ====================
    - name: Compile project (Windows)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        qmake myproject.pro
        nmake release

    - name: Deploy Qt dependencies (Windows Portable)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        mkdir dist
        copy release\myproject.exe dist\
        windeployqt dist\myproject.exe
        Compress-Archive -Path dist\* -DestinationPath myproject-windows-portable.zip

    # ==================== LINUX BUILD & DEPLOYMENT ====================
    - name: Compile project (Linux)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update && sudo apt-get install -y build-essential libgl1-mesa-dev
        qmake myproject.pro
        make

    - name: Package into AppImage (Linux Portable)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        # Download the official linuxdeployqt tool
        wget -c -nv "https://github.com"
        chmod a+x linuxdeployqt-continuous-x86_64.AppImage
        
        # Structure the AppDir according to Linux desktop standards
        mkdir -p appdir/usr/bin
        mkdir -p appdir/usr/share/icons/hicolor/256x256/apps
        
        cp myproject appdir/usr/bin/
        
        # Create a minimal required .desktop entry file
        echo -e "[Desktop Entry]\nType=Application\nName=My Qt Application\nExec=myproject\nIcon=myproject\nCategories=Utility;" > appdir/usr/share/applications/myproject.desktop
        touch appdir/usr/share/icons/hicolor/256x256/apps/myproject.png
        
        # Bundle everything into a single executable binary
        export VERSION="1.0.0"
        ./linuxdeployqt-continuous-x86_64.AppImage appdir/usr/share/applications/myproject.desktop -appimage -unsupported-allow-new-glibc

    # ==================== UPLOAD WORKFLOW ARTIFACTS ====================
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.os }}
        path: |
          *.zip
          *.AppImage

  # ==================== CREATE GITHUB RELEASE ====================
  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essential permission to allow the bot to create a release page
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create GitHub Release and attach binaries
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/release-windows-latest/*.zip
          artifacts/release-ubuntu-22.04/*.AppImage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
