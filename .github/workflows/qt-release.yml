name: Qt6 Portable Build & Release

on:
  push:
    branches:
      - '*' # Triggers automatically on any push to any branch

jobs:
  build:
    name: Build for ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            qt-arch: win64_msvc2022_64
          - os: ubuntu-22.04
            qt-arch: linux_gcc_64 #Updated from gcc_64 to linux_gcc_64 for Qt 6.8+
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Install Qt framework using the community action
    - name: Install Qt 6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        arch: ${{ matrix.qt-arch }}
        modules: qtserialport #Tells the runner to explicitly download the serial port library

    # ==================== WINDOWS BUILD & DEPLOYMENT ====================
    - name: Set up MSVC Developer Command Prompt
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Compile project (Windows)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        qmake Terminal.pro
        nmake release

    - name: Deploy Qt dependencies (Windows Portable)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        mkdir dist
        copy release\Terminal.exe dist\
        windeployqt dist\Terminal.exe
        Compress-Archive -Path dist\* -DestinationPath Terminal-windows-portable.zip

    # ==================== LINUX BUILD & DEPLOYMENT ====================
    - name: Compile project (Linux)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update && sudo apt-get install -y build-essential libgl1-mesa-dev
        qmake Terminal.pro
        make

    - name: Package into AppImage (Linux Portable)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        # Download linuxdeployqt using safe variable split to prevent text truncation bugs
        URL_HOST="https://github.com"
        URL_PATH="/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
        curl -L -o linuxdeployqt.AppImage "${URL_HOST}${URL_PATH}"
        chmod a+x linuxdeployqt.AppImage
        
        mkdir -p appdir/usr/bin
        mkdir -p appdir/usr/share/applications
        mkdir -p appdir/usr/share/icons/hicolor/256x256/apps
        
        cp Terminal appdir/usr/bin/
        
        echo -e "[Desktop Entry]\nType=Application\nName=Terminal\nExec=Terminal\nIcon=Terminal\nCategories=Utility;" > appdir/usr/share/applications/Terminal.desktop
        touch appdir/usr/share/icons/hicolor/256x256/apps/Terminal.png
        
        export VERSION="1.0.0"
        ./linuxdeployqt.AppImage appdir/usr/share/applications/Terminal.desktop -appimage -unsupported-allow-new-glibc

    # ==================== UPLOAD WORKFLOW ARTIFACTS ====================
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.os }}
        path: |
          *.zip
          *.AppImage
